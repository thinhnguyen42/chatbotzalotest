name: docker-publish

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on:
      - self-hosted
      - k3s
      - staging
      - shared
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/smart-home-sh/sunhavens-zalo-oa:${{ github.sha }}
            ghcr.io/smart-home-sh/sunhavens-zalo-oa:latest

      - name: Update image tag in infrastructure
        env:
          INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $INFRA_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Smart-Home-SH/infrastructure/dispatches \
            -d '{"event_type":"update-image","client_payload":{"app":"zalooa","image":"ghcr.io/smart-home-sh/sunhavens-zalo-oa:${{ github.sha }}"}}'