version: '3.8'

services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zalo-chatbot
    restart: always
    ports:
      - "${PORT:-3000}:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - BGEM3_SERVICE_URL=http://bge-m3:5051
      - PHOBERT_SERVICE_URL=http://phobert:5050
      - ZALO_APP_ID=${ZALO_APP_ID}
      - ZALO_APP_SECRET=${ZALO_APP_SECRET}
      - ZALO_OA_SECRET_KEY=${ZALO_OA_SECRET_KEY}
      - ZALO_REFRESH_TOKEN=${ZALO_REFRESH_TOKEN}
      - ZALO_ACCESS_TOKEN=${ZALO_ACCESS_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ZALO_ADMIN_USER_ID=${ZALO_ADMIN_USER_ID}
      - RAG_SIMILARITY_THRESHOLD=${RAG_SIMILARITY_THRESHOLD:-0.85}
      - ADMIN_PHONE_NUMBER=${ADMIN_PHONE_NUMBER}
      # Lark Base
      - LARK_APP_ID=${LARK_APP_ID}
      - LARK_APP_SECRET=${LARK_APP_SECRET}
      - LARK_BASE_APP_TOKEN=${LARK_BASE_APP_TOKEN}
      - LARK_TENANTS_TABLE_ID=${LARK_TENANTS_TABLE_ID}
      - LARK_BOT_LINK_REQUESTS_TABLE_ID=${LARK_BOT_LINK_REQUESTS_TABLE_ID}
      # Báo sự cố
      - LARK_INCIDENTS_TABLE_ID=${LARK_INCIDENTS_TABLE_ID}
      - LARK_INCIDENT_FORM_URL=${LARK_INCIDENT_FORM_URL}
      - SERVER_BASE_URL=${SERVER_BASE_URL}
      # TTLock Integration (Direct Cloud API)
      - TTLOCK_CLIENT_ID=${TTLOCK_CLIENT_ID}
      - TTLOCK_CLIENT_SECRET=${TTLOCK_CLIENT_SECRET}
      - TTLOCK_USERNAME=${TTLOCK_USERNAME}
      - TTLOCK_PASSWORD=${TTLOCK_PASSWORD}
      - TTLOCK_BASE_API=${TTLOCK_BASE_API:-https://euapi.sciener.com}
      - TTLOCK_SERVICE_URL=${TTLOCK_SERVICE_URL:-}
      - TTLOCK_API_TOKEN=${TTLOCK_API_TOKEN:-}
      - PASSCODE_WHITELIST_USER_IDS=${PASSCODE_WHITELIST_USER_IDS:-}
    volumes:
      - ./data:/app/data
    depends_on:
      - bge-m3
      - phobert

  bge-m3:
    build:
      context: ./bge-m3-service
      dockerfile: Dockerfile
    container_name: bge-m3-service
    restart: always
    environment:
      - BGEM3_THRESHOLD=${BGEM3_THRESHOLD:-0.70}
      - BGEM3_FAQ_PATH=/app/data/knowledge-base/faq.md
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface

  phobert:
    build:
      context: ./phobert-service
      dockerfile: Dockerfile
    container_name: phobert-service
    restart: always
    environment:
      - PHOBERT_THRESHOLD=${PHOBERT_THRESHOLD:-0.80}
      - PHOBERT_FAQ_PATH=/app/data/knowledge-base/faq.md
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface

volumes:
  hf_cache:
